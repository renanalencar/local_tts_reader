<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title data-i18n="settingsTitle">LocalReader Settings</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="header">
    <img src="48.png" class="header-icon" alt="LocalReader">
    <div class="header-title">LocalReader</div>
    <div class="version-badge">v1.0.0</div>
    <button class="btn" id="settingsBtn" data-i18n-title="btnSettingsTitle" title="Settings"
      style="width: 24px; height: 24px; margin-left: 12px; background: transparent; color: var(--text-muted); font-size: 14px;">
      <i class="fas fa-cog"></i>
    </button>
  </div>

  <div class="control-panel" id="controlPanel">
    <button class="btn" id="playBtn" data-i18n-title="btnPlayTitle" title="Play">
      <i class="fas fa-play"></i>
    </button>
    <button class="btn" id="pauseBtn" data-i18n-title="btnPauseTitle" title="Pause" disabled>
      <i class="fas fa-pause"></i>
    </button>
    <button class="btn" id="stopBtn" data-i18n-title="btnStopTitle" title="Stop">
      <i class="fas fa-stop"></i>
    </button>
    <button class="btn" id="downloadBtn" data-i18n-title="btnDownloadTitle" title="Download" disabled>
      <i class="fas fa-download"></i>
    </button>

    <div id="loadingIndicator">
      <div class="spinner"></div>
    </div>
  </div>

  <div class="seek-container" id="seekContainer">
    <div class="seek-bar-wrapper">
      <input type="range" id="seekBar" min="0" max="100" value="0" step="0.1" disabled>
    </div>
    <div class="time-display">
      <span id="currentTime">0:00</span>
      <span id="duration">0:00</span>
    </div>
  </div>

  <button class="status-btn" id="statusBtn" data-i18n="readBtn">READ</button>

  <div class="shortcuts">
    <div class="shortcut-row">
      <div class="shortcut-item">
        <span class="key" data-i18n="shortcutClickTitle">Click</span> <span data-i18n="shortcutClickDesc">Read from
          here</span>
      </div>
    </div>
    <div class="shortcut-row">
      <div class="shortcut-item">
        <span class="key">Alt+Shift+S</span> <span data-i18n="shortcutPlayPauseDesc">Play / Pause</span>
      </div>
    </div>
    <div class="shortcut-row">
      <div class="shortcut-item">
        <span class="key">Alt+Shift+X</span> <span data-i18n="shortcutStopDesc">Stop</span>
      </div>
      <div class="shortcut-item">
        <span class="key">Alt+J/K</span> <span data-i18n="shortcutNavDesc">Nav</span>
      </div>
    </div>
  </div>

  <script src="audioPlayer.js"></script>
  <script src="constants.js"></script>
  <script src="textProcessor.js"></script>
  <script src="popup.js"></script>
</body>

</html>
